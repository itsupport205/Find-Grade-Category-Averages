<script>
    const HARDCODED_CLIENT_ID = '1036380348780-g9im8k30a4ptqknhu8j96nmrh766j86b.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/classroom.courses.readonly https://www.googleapis.com/auth/classroom.coursework.students.readonly';
    
    let tokenClient;
    let gapiInited = false;
    let gsiInited = false;

    function gapiLoaded() {
      gapi.load('client', async () => {
        await gapi.client.init({
          discoveryDocs: ["https://classroom.googleapis.com/$discovery/rest?version=v1"],
        });
        gapiInited = true;
      });
    }

    function gisLoaded() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: HARDCODED_CLIENT_ID,
        scope: SCOPES,
        callback: async (resp) => {
          if (resp.error) {
            alert("Google Sign-In Error: " + resp.error);
            return;
          }
          document.getElementById('loginBtn').classList.add('hidden');
          document.getElementById('logoutBtn').classList.remove('hidden');
          await listCourses();
        },
      });
      gsiInited = true;
    }

    function handleAuthClick() {
      if (!gsiInited || !gapiInited) {
        alert("Google libraries are still loading. Please wait 3 seconds and click Sign In again.");
        return;
      }
      
      try {
        if (gapi.client.getToken() === null) {
          tokenClient.requestAccessToken({prompt: 'consent'});
        } else {
          tokenClient.requestAccessToken({prompt: ''});
        }
      } catch (e) {
        console.error(e);
        alert("Could not trigger sign-in popup. Please check if your browser blocked popups for this site.");
      }
    }

    function handleSignoutClick() {
      const token = gapi.client.getToken();
      if (token !== null) {
        google.accounts.oauth2.revoke(token.access_token);
        gapi.client.setToken('');
        document.getElementById('loginBtn').classList.remove('hidden');
        document.getElementById('logoutBtn').classList.add('hidden');
        document.getElementById('courseSelect').innerHTML = '<option value="">-- Sign in with Google to view courses --</option>';
        document.getElementById('dashboardResults').classList.add('hidden');
      }
    }

    async function listCourses() {
      document.getElementById('loadingSpinner').classList.remove('hidden');
      try {
        const response = await gapi.client.classroom.courses.list({
          courseStates: 'ACTIVE',
          teacherId: 'me'
        });
        const courses = response.result.courses;
        const select = document.getElementById('courseSelect');
        
        // Reset dropdown with empty initial value
        select.innerHTML = '<option value="">-- Select a Course --</option>';

        if (courses && courses.length > 0) {
          courses.forEach(c => {
            const courseName = c.name + (c.section ? ' (' + c.section + ')' : '');
            // Ensure c.id is set as the value attribute
            const option = document.createElement('option');
            option.value = c.id;
            option.textContent = courseName;
            select.appendChild(option);
          });
        } else {
          select.innerHTML = '<option value="">No active courses found as teacher.</option>';
        }
      } catch (err) {
        console.error("Error listing courses:", err);
        alert("Error loading courses. Check console or verify Classroom API is enabled.");
      }
      document.getElementById('loadingSpinner').classList.add('hidden');
    }

    async function calculateGrades() {
      const select = document.getElementById('courseSelect');
      const courseId = select.value;

      if (!courseId || courseId === "") {
        alert('Please select a valid course from the list.');
        return;
      }

      document.getElementById('loadingSpinner').classList.remove('hidden');
      document.getElementById('dashboardResults').classList.remove('hidden');
      
      const selectedCourseText = select.options[select.selectedIndex].text;
      document.getElementById('summaryCourseName').innerText = selectedCourseText;
      
      document.getElementById('loadingSpinner').classList.add('hidden');
    }
  </script>
