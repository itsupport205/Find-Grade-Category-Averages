<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Classroom Grade Category Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
  <script src="https://apis.google.com/js/api.js" async defer onload="gapiLoaded()"></script>
  <style>
    .badge-A { background-color: #dcfce7; color: #166534; border-color: #86efac; }
    .badge-B { background-color: #dbeafe; color: #1e40af; border-color: #93c5fd; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 flex flex-col">

  <header class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-graduation-cap text-2xl"></i>
        <h1 class="text-xl font-bold">Classroom Grade Category Calculator</h1>
      </div>
      <div>
        <button id="loginBtn" onclick="handleAuthClick()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-medium text-sm px-4 py-2 rounded-md shadow transition flex items-center gap-2">
          <i class="fa-brands fa-google"></i> Sign in with Google
        </button>
        <button id="logoutBtn" onclick="handleSignoutClick()" class="hidden bg-slate-600 hover:bg-slate-700 text-white font-medium text-sm px-4 py-2 rounded-md shadow transition">
          Sign Out
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8">
      <div class="flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex-grow w-full max-w-xl">
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Select Google Classroom Course</label>
          <select id="courseSelect" class="w-full bg-slate-50 border border-slate-300 text-sm rounded-lg p-3">
            <option value="">-- Sign in with Google to view courses --</option>
          </select>
        </div>
        <button id="calcBtn" onclick="calculateGrades()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-3 rounded-lg shadow-sm text-sm">
          <i class="fa-solid fa-calculator"></i> Calculate Category Averages
        </button>
      </div>
    </section>

    <div id="loadingSpinner" class="hidden py-16 text-center">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent"></div>
      <p class="mt-4 text-sm font-medium text-slate-600">Loading Google Classroom Data...</p>
    </div>

    <div id="dashboardResults" class="hidden space-y-8">
      <div class="bg-white p-6 rounded-xl border border-slate-200">
        <h2 id="summaryCourseName" class="text-xl font-bold text-slate-800">Course Overview</h2>
        <p class="text-sm text-slate-500 mt-1">Select a course to analyze grade categories and student averages.</p>
      </div>
    </div>
  </main>

  <script>
    const HARDCODED_CLIENT_ID = '1036380348780-g9im8k30a4ptqknhu8j96nmrh766j86b.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/classroom.courses.readonly https://www.googleapis.com/auth/classroom.coursework.students.readonly';
    
    let tokenClient;
    let gapiInited = false;
    let gsiInited = false;

    function gapiLoaded() {
      gapi.load('client', async () => {
        await gapi.client.init({
          discoveryDocs: ["https://classroom.googleapis.com/$discovery/rest?version=v1"],
        });
        gapiInited = true;
      });
    }

    function gisLoaded() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: HARDCODED_CLIENT_ID,
        scope: SCOPES,
        callback: async (resp) => {
          if (resp.error) {
            alert("Google Sign-In Error: " + resp.error);
            return;
          }
          document.getElementById('loginBtn').classList.add('hidden');
          document.getElementById('logoutBtn').classList.remove('hidden');
          await listCourses();
        },
      });
      gsiInited = true;
    }

    function handleAuthClick() {
      if (!gsiInited || !gapiInited) {
        alert("Google libraries are still loading. Please wait 3 seconds and click Sign In again.");
        return;
      }
      
      try {
        if (gapi.client.getToken() === null) {
          tokenClient.requestAccessToken({prompt: 'consent'});
        } else {
          tokenClient.requestAccessToken({prompt: ''});
        }
      } catch (e) {
        console.error(e);
        alert("Could not trigger sign-in popup. Please check if your browser blocked popups for this site.");
      }
    }

    function handleSignoutClick() {
      const token = gapi.client.getToken();
      if (token !== null) {
        google.accounts.oauth2.revoke(token.access_token);
        gapi.client.setToken('');
        document.getElementById('loginBtn').classList.remove('hidden');
        document.getElementById('logoutBtn').classList.add('hidden');
        document.getElementById('courseSelect').innerHTML = '<option value="">-- Sign in with Google to view courses --</option>';
        document.getElementById('dashboardResults').classList.add('hidden');
      }
    }

    async function listCourses() {
      document.getElementById('loadingSpinner').classList.remove('hidden');
      try {
        const response = await gapi.client.classroom.courses.list({
          courseStates: 'ACTIVE',
          teacherId: 'me'
        });
        const courses = response.result.courses;
        const select = document.getElementById('courseSelect');
        
        // Reset dropdown with empty initial value
        select.innerHTML = '<option value="">-- Select a Course --</option>';

        if (courses && courses.length > 0) {
          courses.forEach(c => {
            const courseName = c.name + (c.section ? ' (' + c.section + ')' : '');
            // Ensure c.id is set as the value attribute
            const option = document.createElement('option');
            option.value = c.id;
            option.textContent = courseName;
            select.appendChild(option);
          });
        } else {
          select.innerHTML = '<option value="">No active courses found as teacher.</option>';
        }
      } catch (err) {
        console.error("Error listing courses:", err);
        alert("Error loading courses. Check console or verify Classroom API is enabled.");
      }
      document.getElementById('loadingSpinner').classList.add('hidden');
    }

    async function calculateGrades() {
      const select = document.getElementById('courseSelect');
      const courseId = select.value;

      if (!courseId || courseId === "") {
        alert('Please select a valid course from the list.');
        return;
      }

      document.getElementById('loadingSpinner').classList.remove('hidden');
      document.getElementById('dashboardResults').classList.remove('hidden');
      
      const selectedCourseText = select.options[select.selectedIndex].text;
      document.getElementById('summaryCourseName').innerText = selectedCourseText;
      
      document.getElementById('loadingSpinner').classList.add('hidden');
    }
  </script>
</body>
</html>
