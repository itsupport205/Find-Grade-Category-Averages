<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Classroom Grade Category Calculator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google API & Identity Services -->
  <script src="https://accounts.google.com/gsi/client"></script>
  <script src="https://apis.google.com/js/api.js"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white; color: black; }
    }
    .badge-A { background-color: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .badge-B { background-color: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-700 text-white shadow-md no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-white p-2 rounded-lg text-indigo-700 shadow-inner">
          <i class="fa-solid fa-graduation-cap text-2xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Classroom Grade Category Calculator</h1>
          <p class="text-xs text-indigo-200">Google Classroom Category & Student Matrix Analytics</p>
        </div>
      </div>

      <!-- Native Google Auth Button Container -->
      <div class="flex items-center gap-3">
        <div id="googleBtnContainer" class="bg-white rounded-md overflow-hidden p-0.5">
          <!-- Rendered dynamically by Google GSI -->
        </div>
        <button id="logoutBtn" onclick="handleSignoutClick()" class="hidden bg-slate-600 hover:bg-slate-700 text-white font-medium text-sm px-4 py-2 rounded-md shadow transition flex items-center gap-2">
          <i class="fa-solid fa-right-from-bracket"></i> Sign Out
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">

    <!-- Course Selection Toolbar -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8 no-print">
      <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
        <div class="flex-grow max-w-xl">
          <label for="courseSelect" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Select Google Classroom Course</label>
          <div class="relative">
            <select id="courseSelect" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 p-3 pr-8 appearance-none shadow-sm cursor-pointer">
              <option value="">-- Sign in with Google above to load your courses --</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
              <i class="fa-solid fa-chevron-down text-xs"></i>
            </div>
          </div>
        </div>
        <div class="flex items-end gap-3">
          <button id="calcBtn" onclick="calculateGrades()" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-3 rounded-lg shadow-sm transition flex items-center justify-center gap-2 text-sm">
            <i class="fa-solid fa-calculator"></i> Calculate Category Averages
          </button>
        </div>
      </div>
    </section>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="hidden py-16 text-center">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent"></div>
      <p id="spinnerText" class="mt-4 text-sm font-medium text-slate-600">Connecting to Google Classroom...</p>
    </div>

    <!-- Results Dashboard -->
    <div id="dashboardResults" class="hidden space-y-8">
      <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Course Name</div>
          <div id="summaryCourseName" class="text-lg font-bold text-slate-800 mt-1 truncate">-</div>
        </div>
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Enrolled Students</div>
          <div id="summaryStudentCount" class="text-2xl font-bold text-indigo-600 mt-1">0</div>
        </div>
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Grade Categories</div>
          <div id="summaryCategoryCount" class="text-2xl font-bold text-emerald-600 mt-1">0</div>
        </div>
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
          <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Status</div>
          <div id="summaryClassOverall" class="text-2xl font-bold text-purple-600 mt-1">Active</div>
        </div>
      </section>

      <section>
        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
          <i class="fa-
